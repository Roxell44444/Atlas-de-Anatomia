name: Atlas Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate data, import models and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install model conversion dependencies
        run: npm install --ignore-scripts

      - name: Validate offline catalog and educational entries
        run: python tools/validate_catalog.py

      - name: Download and verify separate Z-Anatomy and HRA atlas assets
        run: python tools/download_third_party_atlases.py

      - name: Publish optional offline atlas packs to the asset branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          git clone --depth 1 --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
          git -C "$publish_dir" switch --orphan atlas-model-assets
          git -C "$publish_dir" rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$publish_dir/packs"
          cp build/model-packs/*.zip "$publish_dir/packs/"
          cat > "$publish_dir/README.md" <<'EOF'
          # ATLAS DE ANATOMÍA — paquetes 3D opcionales
          
          Estos paquetes se descargan desde la aplicación cuando el usuario selecciona un atlas externo. Una vez descargados, se guardan localmente para uso sin conexión.
          
          - z_anatomy_male.zip: Z-Anatomy / BodyParts3D, CC BY-SA 4.0.
          - hubmap_hra_female.zip: HuBMAP / Human Reference Atlas, CC BY 4.0.
          
          Cada paquete incluye los avisos de licencia y atribución originales.
          EOF
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add -f packs README.md
          git -C "$publish_dir" commit -m "Publish optional offline anatomy model packs [skip ci]"
          git -C "$publish_dir" push origin HEAD:refs/heads/atlas-model-assets --force

      - name: Download and verify licensed male and female GLB models
        run: python tools/download_anatomy_models.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths for Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot resources
        run: godot --headless --editor --path . --import

      - name: Prepare custom Android launcher icons
        run: godot --headless --path . --script res://tools/prepare_app_icons.gd

      - name: Validate imported male and female anatomy models
        run: godot --headless --path . --script res://tests/validate_runtime.gd

      - name: Keep optional external atlas packs out of the install APK
        shell: bash
        run: |
          rm -rf assets/external_atlases .godot/imported
          godot --headless --editor --path . --import

      - name: Run project startup validation
        run: godot --headless --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/atlas-anatomia-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-anatomia-android-debug
          path: build/atlas-anatomia-debug.apk
          if-no-files-found: error
          retention-days: 14
