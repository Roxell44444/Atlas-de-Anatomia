name: Atlas Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate data, import models and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install model conversion dependencies
        run: npm install --ignore-scripts

      - name: Validate offline catalog and educational entries
        run: python tools/validate_catalog.py

      - name: Download and verify licensed male and female GLB models
        run: python tools/download_anatomy_models.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "ndk;28.1.13356709"

      - name: Set up Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths for Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import Godot resources
        run: godot --headless --editor --path . --import

      - name: Validate imported male and female anatomy models
        run: godot --headless --path . --script res://tests/validate_runtime.gd

      - name: Run project startup validation
        run: godot --headless --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/atlas-anatomia-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-anatomia-android-debug
          path: build/atlas-anatomia-debug.apk
          if-no-files-found: error
          retention-days: 14
